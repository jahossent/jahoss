<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>অনুপ্রেরণা | Jahoss Enterprise Limited</title>
<meta name="theme-color" content="#0b1030"><link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--n:#0F2765;--r:#DA0F32;--d:#1E2227;--bg:#F7F9FD;--t:#252A37;--m:#626C84}
*{box-sizing:border-box}body{margin:0;font-family:"Fira Sans","Hind Siliguri",sans-serif;background:var(--bg);color:var(--t)}
.w{max-width:1180px;margin:auto;padding:0 18px}
.tb{background:#fff;border-bottom:1px solid #e3e8f3}.tb .w{display:flex;align-items:center;gap:14px;padding:10px 18px}.tb img{height:56px;width:auto}.tb b{font:700 clamp(15px,3.6vw,22px) "Fira Sans",sans-serif;color:var(--n)}
.nv{background:var(--d)}.nv .w{display:flex;flex-wrap:wrap}.nv a{color:#fff;text-decoration:none;padding:16px;font-weight:700;font-size:13px;text-transform:uppercase;border-bottom:4px solid transparent}.nv a.on,.nv a:hover{border-color:var(--r);background:rgba(255,255,255,.05)}
.hero{background:linear-gradient(110deg,#0e1320,var(--n));color:#fff;padding:32px 0}.hero h1{margin:0 0 6px;font-size:clamp(26px,5vw,40px)}.hero p{margin:0;color:#c9d3ee;max-width:760px}
.sr{margin:22px 0 10px}.sr input{width:100%;padding:14px 16px;border:1px solid #cfd7ea;font:inherit;border-radius:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}.chip{border:1px solid #cfd7ea;background:#fff;padding:7px 14px;cursor:pointer;font:inherit;font-size:14px;border-radius:2px;color:var(--t)}.chip.on{background:var(--r);border-color:var(--r);color:#fff}
.note{background:#fff;border-left:4px solid var(--r);padding:12px 16px;font-size:14px;color:var(--m);margin-bottom:18px;line-height:1.6}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-bottom:40px}
.c{background:#fff;border-top:3px solid var(--r);box-shadow:0 4px 18px rgba(15,39,101,.08);padding:18px;display:flex;flex-direction:column;gap:8px;transition:transform .25s,box-shadow .25s}.c:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(15,39,101,.16)}
.c .ic{font-size:30px;line-height:1}.c h3{margin:0;font-size:17px;color:var(--n)}.c p{margin:0;font-size:14px;color:var(--m);flex:1;line-height:1.55}
.bd{font-size:12px;padding:2px 8px;align-self:flex-start;background:#e6f4ea;color:#1b6b34}.bd.x{background:#eef1f8;color:var(--m)}.bd.s{background:#fff4d6;color:#8a6200}
.b{display:inline-block;background:var(--r);color:#fff;border:0;padding:10px 16px;font:inherit;font-weight:600;text-decoration:none;cursor:pointer;text-align:center;border-radius:2px;font-size:14px}.b:hover{background:var(--n)}.b.o{background:var(--n)}.b.o:hover{background:var(--r)}.b:disabled{opacity:.5}.bs{display:flex;gap:6px;flex-wrap:wrap}
.md{position:fixed;inset:0;background:rgba(14,19,32,.65);z-index:50;display:flex;padding:16px;overflow:auto}.md.hide{display:none}
.bx{background:#fff;max-width:580px;width:100%;margin:auto;padding:24px;position:relative;border-top:4px solid var(--r)}.bx h2{margin:0 30px 6px 0;color:var(--n)}.bx>p{margin:0 0 14px;color:var(--m);font-size:14px;line-height:1.55}
.cl{position:absolute;top:8px;right:10px;border:0;background:none;font-size:26px;cursor:pointer;color:var(--m)}
.bx label{display:block;font-size:14px;font-weight:600;margin-bottom:12px}.bx input,.bx select,.bx textarea{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid #cfd7ea;font:inherit;font-weight:400;border-radius:2px}
#ms{margin:12px 0;font-size:14px;min-height:20px;color:var(--n);font-weight:600}#ms.er{color:var(--r)}
.rs{margin:8px 0}.rs img{display:block;max-width:100%;max-height:260px;margin-bottom:8px;border:1px solid #e3e8f3}.rs .b,#zp{display:block;word-break:break-all}
.hide{display:none!important}.bx.wide{max-width:920px}.bx h3{margin:18px 0 8px;color:var(--n);font-size:16px}
#iec{max-width:100%;touch-action:none;background:#e9edf5;border:1px solid #cfd7ea;display:block;margin:10px 0}#ieinfo{font-size:13px;color:var(--m)}#ieh{font-size:14px;color:var(--r);font-weight:600;min-height:20px}
.tl{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tl .b{padding:8px 12px;font-size:13px}.gr2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bx input[type=range]{padding:0}.bx input[type=checkbox]{display:inline-block;width:auto;margin:0 6px 0 0}
footer{background:var(--d);color:#aeb6c9;text-align:center;padding:22px;font-size:14px}
.pzx{position:absolute;border:1px dashed rgba(218,15,50,.6);background:rgba(218,15,50,.07);cursor:pointer}.pzx.dn{border-color:#1a8a3a;background:rgba(26,138,58,.14)}.pzx:active{background:rgba(218,15,50,.25)}#pzbx.add{cursor:crosshair;outline:3px solid #1a8a3a}#pzs.er{color:#b00020}#pzs{margin:8px 0;font-size:14px}.pzrw{display:flex;gap:8px;flex-wrap:wrap}.pzrw>div{flex:1 1 150px;min-width:0}.pwb textarea{width:100%;box-sizing:border-box;font:15px/1.4 inherit;border:1px solid #cfd7ea;border-radius:6px;padding:6px 8px;margin:3px 0;resize:none;background:#fff;overflow:hidden}.pwb textarea.ch{border-color:#1a8a3a;background:#effaf1}.pwd{border:1px solid #cfd7ea;border-radius:8px;margin:8px 0;padding:6px 10px;background:#fbfcff}.pwd>summary{font-weight:700;cursor:pointer;padding:6px 0}.pwcv{position:relative;margin:6px 0}.pwcv.on{outline:3px solid #1a8a3a;touch-action:none}#pws.er{color:#b00020}#pws{margin:8px 0;font-size:14px}</style><style id="mo">

body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,10,28,.12) 0%,rgba(8,10,28,.16) 38%,rgba(8,10,28,.52) 62%,rgba(8,10,28,.80) 100%)}
.tb{background:rgba(10,13,24,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.tb img{background:#fff;border-radius:12px;padding:4px;height:52px}.tb b{color:#fff}
.nv{background:rgba(10,13,30,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.nv a{color:var(--soft);transition:.25s}.nv a.on,.nv a:hover{color:#fff;border-color:var(--gold);background:rgba(255,200,87,.1)}
.mhero{text-align:center;padding:24px 0 14px;min-height:56vh;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.kick{display:inline-block;padding:6px 16px;border:1px solid rgba(255,200,87,.55);border-radius:999px;color:var(--gold);font-size:12px;letter-spacing:3px;font-weight:700;background:rgba(10,14,34,.5)}
.mhero h1{margin:16px 0 8px;font-size:clamp(36px,9vw,66px);line-height:1.1;color:#fff;text-shadow:0 3px 24px rgba(0,0,0,.5)}
.mhero p{margin:0 auto;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.85);max-width:560px;font-size:clamp(15px,3.8vw,19px);line-height:1.7}
.qd{margin:26px auto 8px;max-width:760px;background:var(--glass);border:1px solid rgba(255,200,87,.45);border-radius:22px;padding:26px 22px;box-shadow:0 18px 50px rgba(0,0,0,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);text-align:center;position:relative}
.qd small{display:block;color:var(--gold);letter-spacing:3px;font-weight:700;font-size:12px}
.qd blockquote{margin:12px 0 16px;font-size:clamp(20px,5vw,28px);line-height:1.6;font-weight:600;color:#fff}
.qd blockquote:before{content:"“";display:block;font-size:56px;line-height:.6;color:var(--gold)}
.act{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn2{border:1px solid var(--line);background:rgba(255,255,255,.12);color:#fff;padding:11px 16px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;transition:.25s;display:inline-block}
.btn2:hover{background:rgba(255,255,255,.22);transform:translateY(-2px)}
.btn2.g{background:linear-gradient(135deg,var(--gold),#e8a33a);color:#1a1405;border-color:var(--gold)}.btn2.g:hover{background:linear-gradient(135deg,#ffe08a,var(--gold))}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;margin:18px 0 4px}
.ctrl select{background:rgba(10,14,34,.7);color:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit}
.sec h2,.sec small{text-shadow:0 2px 14px rgba(0,0,0,.85)}
.sec{margin:38px 0 10px;scroll-margin-top:70px}.sec small{display:block;color:var(--gold);letter-spacing:3px;font-size:12px;font-weight:700;margin-bottom:4px}.sec h2{margin:0;font-size:clamp(24px,5.5vw,34px);color:#fff}.sec:after{content:"";display:block;width:64px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:12px}
.card{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 12px 36px rgba(0,0,0,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;opacity:0;transform:translateY(14px);animation:up .6s ease forwards}
.card:hover{border-color:rgba(255,200,87,.6)}
.card .no{position:absolute;right:16px;top:6px;font-size:58px;font-weight:800;color:rgba(255,255,255,.08);line-height:1}
.card h3{margin:0 0 10px;font-size:clamp(18px,4.6vw,22px);line-height:1.45;color:var(--gold);padding-right:48px}
.card p{margin:0 0 10px;line-height:1.85;color:#eef1fb;font-size:16px}
.card ul{margin:0 0 10px;padding-left:22px;line-height:1.85;color:#eef1fb}
.card .box{background:rgba(255,200,87,.12);border:1px solid rgba(255,200,87,.4);border-radius:12px;padding:12px 14px;margin:0 0 10px;color:#fff;font-weight:600;line-height:1.8}
.card .act{justify-content:flex-start;margin-top:8px}
.last{text-align:center}.last p{font-size:18px}.last .big{font-size:clamp(22px,6vw,30px);color:var(--gold);font-weight:700;margin-top:6px}
#ttsbar{position:fixed;left:50%;bottom:16px;transform:translate(-50%,120px);z-index:50;background:rgba(10,14,34,.92);border:1px solid var(--gold);border-radius:999px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:12px;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .35s}
#ttsbar.on{transform:translate(-50%,0)}#ttsbar span{color:#fff;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
#hint{display:none;margin:10px auto 0;max-width:640px;padding:10px 14px;border-radius:12px;background:rgba(255,200,87,.14);border:1px solid rgba(255,200,87,.4);color:#fff;font-size:14px;line-height:1.6;text-align:center}
.ctrl label{text-shadow:0 2px 10px rgba(0,0,0,.8)}
footer{background:rgba(10,14,34,.7);border-top:1px solid var(--line);color:var(--soft)}
@keyframes up{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.card{animation:none;opacity:1;transform:none}html{scroll-behavior:auto}}

const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);

const flat=b=>b.map(x=>typeof x==="string"?x:x.li?x.li.join(" "):x.box).join(" ");
function blocks(b){return b.map(x=>typeof x==="string"?`<p>${E(x)}</p>`:x.li?`<ul>${x.li.map(l=>`<li>${E(l)}</li>`).join("")}</ul>`:`<div class="box">${E(x.box)}</div>`).join("")}

function card(title,body,n,cls,key){const id=++tid;TXT[id]=(title?title+". ":"")+flat(body);

async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(_){const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(__){}a.remove()}}

// ---- শোনা (ব্রাউজারের Text-to-Speech)
const synth=window.speechSynthesis;let voice=null,tok=0,au=null;
function pickVoice(){if(!synth)return;const vs=synth.getVoices();voice=vs.find(v=>/^bn[-_]?BD/i.test(v.lang))||vs.find(v=>/^bn/i.test(v.lang))||null}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice}
function chunks(t){const parts=t.replace(/\s+/g," ").match(/[^।.!?]+[।.!?]*/g)||[t],out=[];let cur="";parts.forEach(p=>{p=p.trim();if(!p)return;if(cur&&(cur+" "+p).length>170){out.push(cur);cur=p}else cur=cur?cur+" "+p:p});if(cur)out.push(cur);return out}
function bar(on,t){$("ttsbar").classList.toggle("on",!!on);if(t)$("tt").textContent="শুনছেন: "+t}
function stopAll(){tok++;if(synth)synth.cancel();if(au){try{au.pause()}catch(e){}au=null}bar(false)}
function hint(m){const h=$("hint");h.textContent=m;h.style.display=m?"block":"none"}
// আগে আপনার নিজের কণ্ঠের ফাইল (voice-<নাম>.mp3 বা .m4a) খোঁজে; না পেলে ফোনের কণ্ঠে পড়ে
const EXT=["mp3","m4a"];
function tryAudio(key,i,my,fail,title){if(i>=EXT.length){fail();return}
  const a=new Audio("voice-"+key+"."+EXT[i]);let started=false;a.preload="auto";
  a.oncanplay=()=>{if(my!==tok||started)return;started=true;au=a;a.playbackRate=+$("rate").value;hint("");bar(true,title+" (আমার কণ্ঠে)");a.play().catch(()=>{if(my===tok){au=null;tryAudio(key,i+1,my,fail,title)}})};
  a.onerror=()=>{if(!started&&my===tok)tryAudio(key,i+1,my,fail,title)};
  a.onended=()=>{if(my===tok){au=null;bar(false)}};
  a.load()}
function speakNow(text,title,my){if(!synth){hint("এই ব্রাউজারে শোনার সুবিধা নেই। Chrome ব্যবহার করুন।");return}
  const q=chunks(text);let i=0;
  if(!voice)hint("এই ফোনে বাংলা কণ্ঠ পাওয়া যায়নি, তাই ঠিকমতো না-ও শোনা যেতে পারে। ফোনের Settings-এ Text-to-speech (Google) খুলে বাংলা ভয়েস ইনস্টল করুন।");else hint("");
  bar(true,title);
  const next=()=>{if(my!==tok)return;if(i>=q.length){bar(false);return}const u=new SpeechSynthesisUtterance(q[i++]);u.lang=voice?voice.lang:"bn-BD";if(voice)u.voice=voice;u.rate=+$("rate").value;u.onend=next;u.onerror=()=>{if(my===tok)bar(false)};synth.speak(u)};
  next()}
function speak(text,title,key){stopAll();const my=tok;if(key)tryAudio(key,0,my,()=>speakNow(text,title,my),title);else speakNow(text,title,my)}
$("qs").onclick=()=>speak(QUOTES[qi],"আজকের কথা","q"+(qi+1));
$("stop").onclick=stopAll;
$("all").onclick=()=>speak(FORYOU.t+". "+flat(FORYOU.b)+" "+POINTS.map((p,i)=>"মূলমন্ত্র "+(i+1)+". "+p[0].replace(/!$/,"")+". "+flat(p[1])).join(" ")+" "+flat(CLOSING),"সব কথা","all");
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const t=TXT[b.dataset.i];
  if(b.dataset.a==="say")speak(t,t.slice(0,28)+"...",b.dataset.k||"");else{await copyText(t);flash(b,"কপি হয়েছে ✔")}});
window.addEventListener("pagehide",stopAll);
</script>

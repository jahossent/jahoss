const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);

const flat=b=>b.map(x=>typeof x==="string"?x:x.li?x.li.join(" "):x.box).join(" ");
function blocks(b){return b.map(x=>typeof x==="string"?`<p>${E(x)}</p>`:x.li?`<ul>${x.li.map(l=>`<li>${E(l)}</li>`).join("")}</ul>`:`<div class="box">${E(x.box)}</div>`).join("")}

function card(title,body,n,cls,key){const id=++tid;TXT[id]=(title?title+". ":"")+flat(body);

async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(_){const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(__){}a.remove()}}

// ---- শোনা (ব্রাউজারের Text-to-Speech)
const synth=window.speechSynthesis;let voice=null,tok=0,au=null;
function pickVoice(){if(!synth)return;const vs=synth.getVoices();voice=vs.find(v=>/^bn[-_]?BD/i.test(v.lang))||vs.find(v=>/^bn/i.test(v.lang))||null}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice}
function chunks(t){const parts=t.replace(/\s+/g," ").match(/[^।.!?]+[।.!?]*/g)||[t],out=[];let cur="";parts.forEach(p=>{p=p.trim();if(!p)return;if(cur&&(cur+" "+p).length>170){out.push(cur);cur=p}else cur=cur?cur+" "+p:p});if(cur)out.push(cur);return out}
function bar(on,t){$("ttsbar").classList.toggle("on",!!on);if(t)$("tt").textContent="শুনছেন: "+t}
function stopAll(){tok++;if(synth)synth.cancel();if(au){try{au.pause()}catch(e){}au=null}bar(false)}
function hint(m){const h=$("hint");h.textContent=m;h.style.display=m?"block":"none"}
// আগে আপনার নিজের কণ্ঠের ফাইল (voice-<নাম>.mp3 বা .m4a) খোঁজে; না পেলে ফোনের কণ্ঠে পড়ে
const EXT=["mp3","m4a"];
function tryAudio(key,i,my,fail,title){if(i>=EXT.length){fail();return}
  const a=new Audio("voice-"+key+"."+EXT[i]);let started=false;a.preload="auto";
  a.oncanplay=()=>{if(my!==tok||started)return;started=true;au=a;a.playbackRate=+$("rate").value;hint("");bar(true,title+" (আমার কণ্ঠে)");a.play().catch(()=>{if(my===tok){au=null;tryAudio(key,i+1,my,fail,title)}})};
  a.onerror=()=>{if(!started&&my===tok)tryAudio(key,i+1,my,fail,title)};
  a.onended=()=>{if(my===tok){au=null;bar(false)}};
  a.load()}
function speakNow(text,title,my){if(!synth){hint("এই ব্রাউজারে শোনার সুবিধা নেই। Chrome ব্যবহার করুন।");return}
  const q=chunks(text);let i=0;
  if(!voice)hint("এই ফোনে বাংলা কণ্ঠ পাওয়া যায়নি, তাই ঠিকমতো না-ও শোনা যেতে পারে। ফোনের Settings-এ Text-to-speech (Google) খুলে বাংলা ভয়েস ইনস্টল করুন।");else hint("");
  bar(true,title);
  const next=()=>{if(my!==tok)return;if(i>=q.length){bar(false);return}const u=new SpeechSynthesisUtterance(q[i++]);u.lang=voice?voice.lang:"bn-BD";if(voice)u.voice=voice;u.rate=+$("rate").value;u.onend=next;u.onerror=()=>{if(my===tok)bar(false)};synth.speak(u)};
  next()}
function speak(text,title,key){stopAll();const my=tok;if(key)tryAudio(key,0,my,()=>speakNow(text,title,my),title);else speakNow(text,title,my)}
$("qs").onclick=()=>speak(QUOTES[qi],"আজকের কথা","q"+(qi+1));
$("stop").onclick=stopAll;
$("all").onclick=()=>speak(FORYOU.t+". "+flat(FORYOU.b)+" "+POINTS.map((p,i)=>"মূলমন্ত্র "+(i+1)+". "+p[0].replace(/!$/,"")+". "+flat(p[1])).join(" ")+" "+flat(CLOSING),"সব কথা","all");
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const t=TXT[b.dataset.i];
  if(b.dataset.a==="say")speak(t,t.slice(0,28)+"...",b.dataset.k||"");else{await copyText(t);flash(b,"কপি হয়েছে ✔")}});
window.addEventListener("pagehide",stopAll);
</script>

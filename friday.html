<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>শুক্রবারের কাজ | Jahoss Enterprise Limited</title>
<meta name="theme-color" content="#0b2a26"><link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--n:#0F2765;--r:#DA0F32;--d:#1E2227;--bg:#F7F9FD;--t:#252A37;--m:#626C84}
*{box-sizing:border-box}body{margin:0;font-family:"Fira Sans","Hind Siliguri",sans-serif;background:var(--bg);color:var(--t)}
.w{max-width:1180px;margin:auto;padding:0 18px}
.tb{background:#fff;border-bottom:1px solid #e3e8f3}.tb .w{display:flex;align-items:center;gap:14px;padding:10px 18px}.tb img{height:56px;width:auto}.tb b{font:700 clamp(15px,3.6vw,22px) "Fira Sans",sans-serif;color:var(--n)}
.nv{background:var(--d)}.nv .w{display:flex;flex-wrap:wrap}.nv a{color:#fff;text-decoration:none;padding:16px;font-weight:700;font-size:13px;text-transform:uppercase;border-bottom:4px solid transparent}.nv a.on,.nv a:hover{border-color:var(--r);background:rgba(255,255,255,.05)}
.hero{background:linear-gradient(110deg,#0e1320,var(--n));color:#fff;padding:32px 0}.hero h1{margin:0 0 6px;font-size:clamp(26px,5vw,40px)}.hero p{margin:0;color:#c9d3ee;max-width:760px}
.sr{margin:22px 0 10px}.sr input{width:100%;padding:14px 16px;border:1px solid #cfd7ea;font:inherit;border-radius:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}.chip{border:1px solid #cfd7ea;background:#fff;padding:7px 14px;cursor:pointer;font:inherit;font-size:14px;border-radius:2px;color:var(--t)}.chip.on{background:var(--r);border-color:var(--r);color:#fff}
.note{background:#fff;border-left:4px solid var(--r);padding:12px 16px;font-size:14px;color:var(--m);margin-bottom:18px;line-height:1.6}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-bottom:40px}
.c{background:#fff;border-top:3px solid var(--r);box-shadow:0 4px 18px rgba(15,39,101,.08);padding:18px;display:flex;flex-direction:column;gap:8px;transition:transform .25s,box-shadow .25s}.c:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(15,39,101,.16)}
.c .ic{font-size:30px;line-height:1}.c h3{margin:0;font-size:17px;color:var(--n)}.c p{margin:0;font-size:14px;color:var(--m);flex:1;line-height:1.55}
.bd{font-size:12px;padding:2px 8px;align-self:flex-start;background:#e6f4ea;color:#1b6b34}.bd.x{background:#eef1f8;color:var(--m)}.bd.s{background:#fff4d6;color:#8a6200}
.b{display:inline-block;background:var(--r);color:#fff;border:0;padding:10px 16px;font:inherit;font-weight:600;text-decoration:none;cursor:pointer;text-align:center;border-radius:2px;font-size:14px}.b:hover{background:var(--n)}.b.o{background:var(--n)}.b.o:hover{background:var(--r)}.b:disabled{opacity:.5}.bs{display:flex;gap:6px;flex-wrap:wrap}
.md{position:fixed;inset:0;background:rgba(14,19,32,.65);z-index:50;display:flex;padding:16px;overflow:auto}.md.hide{display:none}
.bx{background:#fff;max-width:580px;width:100%;margin:auto;padding:24px;position:relative;border-top:4px solid var(--r)}.bx h2{margin:0 30px 6px 0;color:var(--n)}.bx>p{margin:0 0 14px;color:var(--m);font-size:14px;line-height:1.55}
.cl{position:absolute;top:8px;right:10px;border:0;background:none;font-size:26px;cursor:pointer;color:var(--m)}
.bx label{display:block;font-size:14px;font-weight:600;margin-bottom:12px}.bx input,.bx select,.bx textarea{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid #cfd7ea;font:inherit;font-weight:400;border-radius:2px}
#ms{margin:12px 0;font-size:14px;min-height:20px;color:var(--n);font-weight:600}#ms.er{color:var(--r)}
.rs{margin:8px 0}.rs img{display:block;max-width:100%;max-height:260px;margin-bottom:8px;border:1px solid #e3e8f3}.rs .b,#zp{display:block;word-break:break-all}
.hide{display:none!important}.bx.wide{max-width:920px}.bx h3{margin:18px 0 8px;color:var(--n);font-size:16px}
#iec{max-width:100%;touch-action:none;background:#e9edf5;border:1px solid #cfd7ea;display:block;margin:10px 0}#ieinfo{font-size:13px;color:var(--m)}#ieh{font-size:14px;color:var(--r);font-weight:600;min-height:20px}
.tl{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tl .b{padding:8px 12px;font-size:13px}.gr2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bx input[type=range]{padding:0}.bx input[type=checkbox]{display:inline-block;width:auto;margin:0 6px 0 0}
footer{background:var(--d);color:#aeb6c9;text-align:center;padding:22px;font-size:14px}
.pzx{position:absolute;border:1px dashed rgba(218,15,50,.6);background:rgba(218,15,50,.07);cursor:pointer}.pzx.dn{border-color:#1a8a3a;background:rgba(26,138,58,.14)}.pzx:active{background:rgba(218,15,50,.25)}#pzbx.add{cursor:crosshair;outline:3px solid #1a8a3a}#pzs.er{color:#b00020}#pzs{margin:8px 0;font-size:14px}.pzrw{display:flex;gap:8px;flex-wrap:wrap}.pzrw>div{flex:1 1 150px;min-width:0}.pwb textarea{width:100%;box-sizing:border-box;font:15px/1.4 inherit;border:1px solid #cfd7ea;border-radius:6px;padding:6px 8px;margin:3px 0;resize:none;background:#fff;overflow:hidden}.pwb textarea.ch{border-color:#1a8a3a;background:#effaf1}.pwd{border:1px solid #cfd7ea;border-radius:8px;margin:8px 0;padding:6px 10px;background:#fbfcff}.pwd>summary{font-weight:700;cursor:pointer;padding:6px 0}.pwcv{position:relative;margin:6px 0}.pwcv.on{outline:3px solid #1a8a3a;touch-action:none}#pws.er{color:#b00020}#pws{margin:8px 0;font-size:14px}</style>
<style id="fr">
:root{--card:rgba(7,34,30,.86);--ink:#eaf5ee;--mut:#a9c9bc;--line:rgba(217,180,90,.40);--acc:#1b7a61;--navbg:rgba(4,22,19,.96);--gold:#d9b45a}
html{background:#0b2a26;scroll-behavior:smooth}
body{background:transparent;color:var(--ink);position:relative;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--bgimg) center center/cover no-repeat #0b2a26}
.tb{background:var(--card);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tb img{background:#fff;border-radius:12px;padding:4px;height:52px}.tb b{color:var(--ink)}
.nv{background:var(--navbg);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.nv a{color:#fff}.nv a.on,.nv a:hover{color:#fff;background:rgba(255,255,255,.08);border-bottom-color:var(--gold);border-color:var(--gold)}
.fh{min-height:44vh;padding:34px 0 10px;text-align:left;text-shadow:0 0 12px rgba(4,22,19,.95),0 0 4px rgba(4,22,19,.95)}
.fh .kick{display:inline-block;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:12px;letter-spacing:3px;font-weight:700;text-shadow:none}
.fh h1{margin:14px 0 8px;font-size:clamp(30px,8vw,46px);line-height:1.15;color:var(--ink)}
.fh p{margin:0;max-width:560px;font-size:16px;line-height:1.6;color:var(--ink);font-weight:500}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.prog b{font-size:18px}.prog .bar{height:12px;border-radius:99px;background:rgba(255,255,255,.14);margin:10px 0 0;overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .4s}
.card .top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.card .no{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.card h3{margin:0;font-size:19px;line-height:1.3;color:var(--ink)}
.card p{margin:0 0 14px;font-size:16px;line-height:1.7;color:var(--ink)}
.card.done{opacity:.78}.card.done .no{background:var(--gold);color:#1a1405}
.fb{display:flex;align-items:center;justify-content:center;width:100%;height:48px;border-radius:14px;border:2px solid var(--acc);background:var(--acc);color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
.fb.on{background:transparent;color:var(--gold);border-color:var(--gold)}
.fb:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
footer{background:var(--navbg);color:#cfe6dc;text-align:center;padding:18px;margin-top:24px}
@media(min-width:760px){#ms{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}#ms .box{margin:0}}
</style>

const M=[["ফোন পরিষ্কার মিশন", "Settings অপশনে গিয়ে স্টোরেজ চেক করুন কোন অ্যাপ কত জায়গা নষ্ট করছে। গত ৩ মাসে একবারও ব্যবহার করেননি এমন অপ্রয়োজনীয় অ্যাপগুলো সরাসরি আনইনস্টল করুন। হোয়াটসঅ্যাপের জমে থাকা ভারী ভিডিও ডিলিট করে দিন। লক্ষ্য রাখুন অন্তত ২GB খালি জায়গা বের করে ফোন ফাস্ট করা।"], ["জিমেইল ইনবক্স জিরো মিশন", "সার্চ বারে unsubscribe লিখে সার্চ করুন। অযথা পাঠানো প্রমোশনাল মেইলগুলো থেকে একে একে আনসাবস্ক্রাইব করে নিন। পুরনো অপ্রয়োজনীয় শত শত মেইল একসাথে সিলেক্ট করে আর্কাইভ বা ডিলিট করে দিন। ইনবক্স শূন্য থাকলে কাজের মানসিক চাপ অর্ধেকের বেশি কমে যায়।"], ["পাসওয়ার্ড নিরাপত্তা মিশন", "সব অ্যাকাউন্টে একই পাসওয়ার্ড ব্যবহারের মারাত্মক ভুল বন্ধ করুন। গুগল পাসওয়ার্ড ম্যানেজার বা বিটওয়ার্ডেন (Bitwarden) ব্যবহার করে ইউনিক ও জটিল পাসওয়ার্ড সেভ রাখুন। যেকোনো সোশ্যাল ও অফিসিয়াল গুরুত্বপূর্ণ অ্যাকাউন্টে টু-ফ্যাক্টর অথেনটিকেশন (2FA) অন করে হ্যাকিংয়ের ঝুঁকি দূর করুন।"], ["ছবির ক্লাউড ব্যাকআপ মিশন", "গুগল ফটোস চালু করে অটোমেটিক ব্যাকআপ অন আছে কিনা নিশ্চিত করুন। ফোন হারিয়ে গেলে বা নষ্ট হয়ে গেলেও যেন স্মৃতিগুলো হারিয়ে না যায়। পরিবারের পুরনো অ্যালবাম থেকে গুরুত্বপূর্ণ ছবিগুলো স্ক্যান করে সুরক্ষিত গুগল ড্রাইভে ব্যাকআপ রাখুন।"], ["পুরনো ছবি রিস্টোর মিশন", "বাবা-মায়ের পুরনো সাদাকালো বা ফাটা ছবি এআই দিয়ে নিখুঁতভাবে রিস্টোর ও কালারাইজ করুন। রেতিনি (Remini) বা মাইহেরিটেজ (MyHeritage) টুলের ফ্রি অপশন ব্যবহার করে একটি ছবি তৈরি করে পরিবারের সদস্যদের উপহার দিয়ে চমকে দিন।"], ["লাইফ ড্যাশবোর্ড মিশন", "নোশন অথবা গুগল কিপ ব্যবহার করে একটি ফ্রেশ পেজ ওপেন করুন। সেখানে লিখে ফেলুন: এই মাসের আসল লক্ষ্য, নিয়মিত খরচের হিসেব ও নতুন কী স্কিল শিখবেন তার তালিকা। ছুটির দিনে মাত্র ৩০ মিনিট সময় দিলে পুরো মাসের রুটিন আয়ত্তে চলে আসবে।"], ["বাজেট শিট মিশন", "গুগল শিটসে একটি সাধারণ ট্র্যাকার তৈরি করুন: মোট আয়, ব্যয়ের খাত ও সেভিংসের লক্ষ্যমাত্রা। গত মাসে কোন খাতে বাড়তি খরচ হয়েছে তা স্পষ্ট লিখে রাখুন। চোখের সামনে ব্যয়ের সঠিক পরিসংখ্যান দেখলে অযথা খরচের প্রবণতা নিজে থেকেই কমে যায়।"], ["ডিজিটাল ডিটক্স মিশন", "ফোনের ডিজিটাল ওয়েলবিং বা স্ক্রিন টাইম চেক করুন। সবচেয়ে বেশি সময় নষ্ট করা শীর্ষ ২টি অ্যাপে দৈনিক ব্যবহারের নির্দিষ্ট লিমিট বসিয়ে দিন। ছুটির বাকি সময়টা অহেতুক সোশ্যাল মিডিয়ায় স্ক্রল না করে পরিবার ও কাছের মানুষদের সাথে প্রাণখুলে কাটান।"]];
const KEY="jahoss_friday_done";
const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let done=[];try{done=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}
function draw(){
  document.getElementById("ms").innerHTML=M.map((m,i)=>{const d=done.includes(i);return `<div class="box card${d?" done":""}"><div class="top"><span class="no">${d?"✓":bn(i+1)}</span><h3>${esc(m[0])}</h3></div><p>${esc(m[1])}</p><button class="fb${d?" on":""}" data-i="${i}">${d?"✔ সম্পন্ন (আবার খুলতে চাপুন)":"করা হয়ে গেছে, টিক দিন"}</button></div>`}).join("");
  document.getElementById("pt").textContent=bn(done.length)+"/"+bn(M.length)+" সম্পন্ন";
  document.getElementById("pb").style.width=(done.length/M.length*100)+"%";
}
document.getElementById("ms").addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(!b)return;const i=+b.dataset.i;done=done.includes(i)?done.filter(x=>x!==i):[...done,i];save();draw()});
document.getElementById("rs").addEventListener("click",()=>{if(!done.length||confirm("সব টিক মুছে দেবেন?")){done=[];save();draw()}});
draw();
</script>
</body></html>
